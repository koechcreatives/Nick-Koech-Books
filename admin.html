<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Nick Koech Books</title>
<style>
:root{--bg:#f5f0e8;--ink:#2a2d36;--soft:#6a6558;--acc:#7a2437;--on:#fff;--card:#fffdf8;--line:#ddd3c3;--ok:#2f7d4f}
@media(prefers-color-scheme:dark){:root{--bg:#1b1c22;--ink:#efe9df;--soft:#a39e92;--acc:#e8a0b0;--on:#1b1c22;--card:#24262e;--line:#383a44;--ok:#6fcf97}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:1.5rem;margin:6px 0 2px;color:var(--acc)}
.sub{color:var(--soft);margin:0 0 16px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,button{font:inherit}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:10px}
button{padding:10px 16px;border:0;border-radius:10px;background:var(--acc);color:var(--on);font-weight:bold;cursor:pointer}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.5rem;color:var(--acc)}
.stat span{color:var(--soft);font-size:.85rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.tabs button{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:normal;padding:8px 14px}
.tabs button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.em{font-weight:bold;word-break:break-all}
.meta{color:var(--soft);font-size:.85rem}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;border:1px solid var(--line);margin-right:4px}
.paid{color:var(--ok);border-color:var(--ok)}
.bk{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--acc);background:var(--bg);border-radius:6px;font-size:.9rem}
.err{color:#b3261e;margin:8px 0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin</h1>
  <p class="sub">Nick Koech Books · readers and sales</p>

  <div id="login" class="card hide">
    <p>Sign in with the owner account.</p>
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="go">Sign in</button>
    <div id="lerr" class="err"></div>
  </div>

  <div id="app" class="hide">
    <div class="stats" id="stats"></div>
    <div class="card">
      <input id="q" type="search" placeholder="Search by email">
      <div class="tabs" id="tabs">
        <button data-t="all" class="on">All</button>
        <button data-t="paid">Paid</button>
        <button data-t="none">Not bought</button>
      </div>
      <button class="alt" id="csv">Download CSV</button>
      <button class="alt" id="out">Sign out</button>
    </div>
    <div id="list"></div>
    <div id="aerr" class="err"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient("https://satitxyuyzsgfmprqbqh.supabase.co","sb_publishable_wggLzRt2tUxcyjPY0znQAg_BGGFVwt2");
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => d ? new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "never";
let rows = [], tab = "all";

async function load(){
  $("aerr").textContent = "";
  const {data,error} = await sb.rpc("admin_customers");
  if(error){
    $("app").classList.add("hide"); $("login").classList.remove("hide");
    $("lerr").textContent = /not authorized/i.test(error.message) ? "This account is not allowed to view the admin page." : "Could not load: "+error.message;
    return;
  }
  rows = data || [];
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  render();
}
function render(){
  const paid = rows.filter(r=>r.purchase_count>0);
  const kes = rows.reduce((a,r)=>a+Number(r.total_kes||0),0);
  const usd = rows.reduce((a,r)=>a+Number(r.total_usd||0),0);
  $("stats").innerHTML =
    `<div class="stat"><b>${rows.length}</b><span>Accounts</span></div>`+
    `<div class="stat"><b>${paid.length}</b><span>Paid readers</span></div>`+
    `<div class="stat"><b>${rows.length-paid.length}</b><span>Not bought yet</span></div>`+
    `<div class="stat"><b>KES ${kes.toLocaleString()}${usd?` + $${usd.toLocaleString()}`:""}</b><span>Total sales</span></div>`;
  const q = $("q").value.trim().toLowerCase();
  const list = rows.filter(r=>
    (tab==="all" || (tab==="paid"?r.purchase_count>0:r.purchase_count===0)) &&
    (!q || (r.email||"").toLowerCase().includes(q)));
  $("list").innerHTML = list.length ? list.map(r=>{
    const bk = (r.purchases||[]).map(p=>`<div class="bk">${esc(p.book)} · ${esc(p.currency)} ${Number(p.amount).toLocaleString()} · ${fmt(p.at)}</div>`).join("");
    return `<div class="card"><div class="row"><div><div class="em">${esc(r.email)}</div>
      <div class="meta">Joined ${fmt(r.signed_up)} · last seen ${fmt(r.last_sign_in)}</div></div>
      <div>${r.purchase_count>0?`<span class="pill paid">${r.purchase_count} bought</span>`:`<span class="pill">no purchase</span>`}</div></div>
      <div class="meta" style="margin-top:4px">${r.email_confirmed?"Email confirmed":"Email not confirmed"}</div>${bk}</div>`;
  }).join("") : `<div class="card meta">Nobody here yet.</div>`;
}
$("tabs").onclick = e => { const t=e.target.dataset.t; if(!t) return; tab=t; [...$("tabs").children].forEach(b=>b.classList.toggle("on",b.dataset.t===t)); render(); };
$("q").oninput = render;
$("go").onclick = async () => {
  $("lerr").textContent = "";
  const {error} = await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error){ $("lerr").textContent = error.message; return; }
  load();
};
$("out").onclick = async () => { await sb.auth.signOut(); rows=[]; $("app").classList.add("hide"); $("login").classList.remove("hide"); };
$("csv").onclick = () => {
  const head = ["email","joined","last_sign_in","email_confirmed","purchases","total_kes","total_usd","books"];
  const q = v => '"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const lines = [head.join(",")].concat(rows.map(r=>[r.email,r.signed_up,r.last_sign_in,r.email_confirmed,r.purchase_count,r.total_kes,r.total_usd,(r.purchases||[]).map(p=>p.book).join("; ")].map(q).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));
  a.download = "nick-koech-books-readers.csv"; a.click();
};
sb.auth.getSession().then(({data})=>{ if(data.session) load(); else $("login").classList.remove("hide"); });
</script>
</body>
</html>
